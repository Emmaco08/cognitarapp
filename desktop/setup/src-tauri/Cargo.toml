[package]
name = "cognitara-setup"
version = "2.2.4"
description = "CogniTara Studio custom Windows setup experience (Tauri v2 + WebView2)"
authors = ["CogniTara Education Technologies"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77"
publish = false

[[bin]]
name = "cognitara-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Small, fast setup binary. The NSIS payload is embedded verbatim (already compressed).
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
