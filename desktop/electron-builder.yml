appId: net.cognitara.studio
productName: CogniTara Studio
copyright: Copyright © 2026 CogniTara
asar: true
afterPack: scripts/after-pack.cjs
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: resources/engine
    to: engine
    filter:
      - "**/*"
publish:
  - provider: github
    owner: Emmaco08
    repo: cognitarapp
    releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/cognitara-favicon.ico
  # The NSIS installer is the electron-updater package (and the payload embedded in
  # the custom Tauri setup). The human-facing download is the Tauri setup, published
  # as "CogniTara-Studio-Setup-<ver>-x64.exe" by CI. latest.yml is generated from
  # this artifactName, so the updater always points at the right asset.
  artifactName: "CogniTara-Studio-Update-${version}-${arch}.${ext}"
  requestedExecutionLevel: asInvoker
  # Code signing (see docs/CODE_SIGNING.md). Inert while no certificate is configured:
  #   - PFX:   CI exports WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD secrets as CSC_LINK /
  #            CSC_KEY_PASSWORD; publisherName is then read from the certificate CN.
  #   - Azure: CI passes -c.win.azureSignOptions.* (+ optional publisherName) on the
  #            command line only when the AZURE_* secrets exist.
  # Do NOT hard-code publisherName here while builds are unsigned: electron-updater
  # would then reject every unsigned update.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CogniTara Studio
  installerIcon: assets/cognitara-favicon.ico
  uninstallerIcon: assets/cognitara-favicon.ico
  installerHeaderIcon: assets/cognitara-favicon.ico
  installerHeader: installer/assets/header.bmp
  installerSidebar: installer/assets/sidebar.bmp
  uninstallerSidebar: installer/assets/sidebar.bmp
  include: installer/installer.nsh
  deleteAppDataOnUninstall: false
  differentialPackage: true
