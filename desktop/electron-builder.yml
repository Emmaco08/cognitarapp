appId: net.cognitara.studio
productName: CogniTara Studio
copyright: Copyright © 2026 CogniTara
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: resources/engine
    to: engine
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/cognitara-favicon.ico
  artifactName: "CogniTara-Studio-Setup-${version}-${arch}.${ext}"
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CogniTara Studio
  installerIcon: assets/cognitara-favicon.ico
  uninstallerIcon: assets/cognitara-favicon.ico
  installerHeaderIcon: assets/cognitara-favicon.ico
  deleteAppDataOnUninstall: false
