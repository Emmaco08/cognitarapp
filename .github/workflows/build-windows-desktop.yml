name: Build CogniTara Studio Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      use_pyarmor:
        description: "Obfuscate cognitara/security modules with PyArmor (if available)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Test, Freeze Engine & Package Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Initialize fresh SQLite database
        shell: pwsh
        run: python init_db.py

      - name: Validate modular architecture & 201 baseline routes
        shell: pwsh
        run: python scripts/validate_architecture.py

      - name: Run Python test suite (5-Layer Vault, E2E Live Exam, Persistence, Phase 4.6, Security, DR)
        shell: pwsh
        env:
          COGNITARA_TESTING_BYPASS_LICENSE: "1"
        run: |
          pytest `
            tests/test_license_vault.py `
            tests/test_end_to_end_desktop_exam_flow.py `
            tests/test_modular_architecture_and_persistence.py `
            tests/test_phase4_6_master.py `
            tests/test_security_audit_phase4_4.py `
            tests/test_disaster_recovery.py `
            -v

      - name: Freeze cognitara-engine.exe with PyInstaller & run smoke test
        shell: pwsh
        env:
          COGNITARA_USE_PYARMOR: ${{ inputs.use_pyarmor == true && '1' || '0' }}
        run: python desktop/build_engine.py

      - name: Install Electron desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: npm ci

      - name: Typecheck & build Electron Studio app
        working-directory: desktop
        shell: pwsh
        run: |
          npm run typecheck
          npm run build

      - name: Verify cross-runtime Python <-> Electron Ed25519 signature verification
        shell: pwsh
        run: python scripts/verify_cross_runtime_ed25519.py

      - name: Package Windows NSIS .exe installer (electron-builder)
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Generate SHA-256 checksums for release installer
        working-directory: desktop/release
        shell: pwsh
        run: |
          Get-ChildItem -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8
          Get-Content "SHA256SUMS.txt"

      - name: Upload Windows .exe installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CogniTara-Studio-Windows-Installer
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download Windows Installer Release (v2.0.0-preview)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v2.0.0-preview" }
          $exe = (Get-ChildItem -Path "desktop/release" -Filter "*.exe" | Select-Object -First 1).FullName
          $sums = "desktop/release/SHA256SUMS.txt"
          $notes = @"
          CogniTara Studio 2.0.0 — Windows Desktop App & Studio v2 Admin Portal

          Includes:
          - Frameless CogniTara Studio desktop launcher (zero console windows, Windows System Tray)
          - Embedded cognitara-engine.exe (Flask + Waitress + self-healing SQLite WAL bootstrap)
          - 5-Layer Windows Licence & Anti-Clock-Tamper Vault with one-click 14-day hardware-bound evaluation trial
          - Studio v2 Login & Admin Console (Obsidian Dark & Daylight Ceramic Light)
          - Verified end-to-end live CBT exam execution, instant answer persistence, and hot SQLite backups
          "@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $sums --clobber
            gh release edit $tag --title "CogniTara Studio 2.0.0 (Windows Installer)" --notes $notes
          } else {
            gh release create $tag $exe $sums --title "CogniTara Studio 2.0.0 (Windows Installer)" --notes $notes --prerelease
          }
