name: Build CogniTara Studio Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      use_pyarmor:
        description: "Obfuscate cognitara/security modules with PyArmor (if available)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Test, Freeze Engine & Package Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Initialize fresh SQLite database
        shell: pwsh
        run: python init_db.py

      - name: Validate modular architecture & 201 baseline routes
        shell: pwsh
        run: python scripts/validate_architecture.py

      - name: Run Python test suite (5-Layer Vault, Persistence, Phase 4.6, Security, DR)
        shell: pwsh
        env:
          COGNITARA_TESTING_BYPASS_LICENSE: "1"
        run: |
          pytest `
            tests/test_license_vault.py `
            tests/test_modular_architecture_and_persistence.py `
            tests/test_phase4_6_master.py `
            tests/test_security_audit_phase4_4.py `
            tests/test_disaster_recovery.py `
            -v

      - name: Freeze cognitara-engine.exe with PyInstaller & run smoke test
        shell: pwsh
        env:
          COGNITARA_USE_PYARMOR: ${{ inputs.use_pyarmor == true && '1' || '0' }}
        run: python desktop/build_engine.py

      - name: Install Electron desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: npm ci

      - name: Typecheck & build Electron Studio app
        working-directory: desktop
        shell: pwsh
        run: |
          npm run typecheck
          npm run build

      - name: Verify cross-runtime Python <-> Electron Ed25519 signature verification
        shell: pwsh
        run: |
          python -c "
          import json, base64, subprocess
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          from cognitara.security.license_guard import canonical_json_bytes
          b64u = lambda b: base64.urlsafe_b64encode(b).decode('ascii').rstrip('=')
          priv = Ed25519PrivateKey.generate()
          pub_b64 = b64u(priv.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw))
          payload = {'license_id': 'LIC-CI', 'plan_tier': 'annual', 'school_name': 'CI School', 'hwid_hash': 'ci-hwid'}
          env = {'payload': payload, 'ed25519_sig': b64u(priv.sign(canonical_json_bytes(payload)))}
          js = f'''
          const {{ verifyEd25519LeaseInElectron }} = require(\"./desktop/dist/main/license-bridge.js\");
          const ok = verifyEd25519LeaseInElectron({json.dumps(env)}, {json.dumps(pub_b64)});
          if (!ok.ok) {{ console.error(ok); process.exit(1); }}
          console.log(\"Electron Layer 5 Ed25519 check passed:\", ok);
          '''
          subprocess.run(['node', '-e', js], check=True)
          "

      - name: Package Windows NSIS .exe installer (electron-builder)
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Generate SHA-256 checksums for release installer
        working-directory: desktop/release
        shell: pwsh
        run: |
          Get-ChildItem -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8
          Get-Content "SHA256SUMS.txt"

      - name: Upload Windows .exe installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CogniTara-Studio-Windows-Installer
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
