name: Build CogniTara Studio Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      use_pyarmor:
        description: "Obfuscate cognitara/security modules with PyArmor (if available)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Test, Freeze Engine & Package Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Initialize fresh SQLite database
        shell: pwsh
        run: python init_db.py

      - name: Validate modular architecture & 201 baseline routes
        shell: pwsh
        run: python scripts/validate_architecture.py

      - name: Run Python test suite (Write Paths, 5-Layer Vault, E2E Live Exam, Persistence, Phase 4.6, Security, DR)
        shell: pwsh
        env:
          COGNITARA_TESTING_BYPASS_LICENSE: "1"
        run: |
          pytest `
            tests/test_windows_write_paths.py `
            tests/test_license_vault.py `
            tests/test_end_to_end_desktop_exam_flow.py `
            tests/test_modular_architecture_and_persistence.py `
            tests/test_phase4_6_master.py `
            tests/test_security_audit_phase4_4.py `
            tests/test_disaster_recovery.py `
            -v

      - name: Generate modern Opus Studio Windows installer showcase bitmaps
        shell: pwsh
        run: python desktop/installer/generate_installer_assets.py

      - name: Freeze cognitara-engine.exe with PyInstaller & run smoke test
        shell: pwsh
        env:
          COGNITARA_USE_PYARMOR: ${{ inputs.use_pyarmor == true && '1' || '0' }}
        run: python desktop/build_engine.py

      - name: Install Electron desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: npm ci

      - name: Typecheck & build Electron Studio app
        working-directory: desktop
        shell: pwsh
        run: |
          npm run typecheck
          npm run build

      - name: Verify cross-runtime Python <-> Electron Ed25519 signature verification
        shell: pwsh
        run: python scripts/verify_cross_runtime_ed25519.py

      - name: Package modern Windows NSIS .exe installer & electron-updater metadata
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify electron-updater metadata (latest.yml + .blockmap + .exe) & generate SHA-256 checksums
        working-directory: desktop/release
        shell: pwsh
        run: |
          Get-ChildItem -Name
          if (-not (Test-Path "latest.yml")) { throw "Missing latest.yml required by electron-updater!" }
          $blockmap = Get-ChildItem -Filter "*.blockmap" | Select-Object -First 1
          if (-not $blockmap) { throw "Missing .blockmap required by electron-updater!" }
          Get-ChildItem -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8
          Get-Content "SHA256SUMS.txt"

      - name: Upload Windows .exe installer & auto-update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CogniTara-Studio-Windows-Installer
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download Windows Installer Release (v2.1.0 + electron-updater feed)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkgVer = (Get-Content "desktop/package.json" | ConvertFrom-Json).version
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$pkgVer" }
          $exe = (Get-ChildItem -Path "desktop/release" -Filter "*.exe" | Select-Object -First 1).FullName
          $blockmap = (Get-ChildItem -Path "desktop/release" -Filter "*.blockmap" | Select-Object -First 1).FullName
          $latestYml = (Resolve-Path "desktop/release/latest.yml").Path
          $sums = (Resolve-Path "desktop/release/SHA256SUMS.txt").Path
          $notes = @"
          CogniTara Studio $pkgVer — Windows Desktop App, Modern Showcase Installer & Cloud Sync

          What's New in $pkgVer:
          - **Fixed Windows C:\Program Files\ PermissionError:** All engine writes (`logs/`, `static/images/`, `exam.db`, `.secret_key`, backups) now route strictly into `%ProgramData%\CogniTara\data\` (with `%LOCALAPPDATA%` fallback).
          - **Butter-Smooth 60fps Studio UI:** Removed heavy full-window `backdrop-filter: blur(60px)` & blur keyframes, GPU-accelerated transitions (`transform`/`opacity`), and eliminated canvas/DOM layout jank.
          - **Modern Photoshop/CorelDRAW-Style Windows Installer:** Dark Midnight Navy Opus Studio setup with interactive 5-slide feature showcase carousel and animated progress installation.
          - **Direct In-App Auto-Updates (`electron-updater`):** Includes `latest.yml` + `.blockmap` delta updates with live download progress and safe server-stop + active-exam protection before restart.
          - **Neon Postgres + Vercel Cloud Sign-Up & Sign-In:** Real online school account registration & sign-in (`https://cognitara-cloud.vercel.app`) with encrypted offline-ready local caching inside Studio.
          "@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $blockmap $latestYml $sums --clobber
            gh release edit $tag --title "CogniTara Studio $pkgVer (Windows Installer)" --notes $notes --latest
          } else {
            gh release create $tag $exe $blockmap $latestYml $sums --title "CogniTara Studio $pkgVer (Windows Installer)" --notes $notes --latest
          }
