<!DOCTYPE html>
<html>
<head>
    <title>Login | COGNITARA EXAM SYSTEM</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8edf5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative Background Layer */
        .bg-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        /* Animated Educational Background Icons */
        .moving-icon {
            position: absolute;
            font-size: 24px;
            opacity: 0.15;
            pointer-events: none;
            animation: floatAround 20s infinite linear;
            z-index: 0;
        }

        @keyframes floatAround {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(30px, -20px) rotate(90deg);
            }
            50% {
                transform: translate(60px, 10px) rotate(180deg);
            }
            75% {
                transform: translate(30px, 30px) rotate(270deg);
            }
            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }

        /* Different speeds for different icons */
        .moving-icon:nth-child(1) { animation-duration: 15s; top: 10%; left: 5%; font-size: 40px; }
        .moving-icon:nth-child(2) { animation-duration: 20s; top: 70%; left: 15%; font-size: 35px; animation-direction: reverse; }
        .moving-icon:nth-child(3) { animation-duration: 18s; top: 30%; left: 85%; font-size: 45px; }
        .moving-icon:nth-child(4) { animation-duration: 22s; top: 80%; left: 80%; font-size: 30px; animation-direction: reverse; }
        .moving-icon:nth-child(5) { animation-duration: 17s; top: 50%; left: 10%; font-size: 25px; }
        .moving-icon:nth-child(6) { animation-duration: 25s; top: 15%; left: 70%; font-size: 50px; }
        .moving-icon:nth-child(7) { animation-duration: 19s; top: 60%; left: 90%; font-size: 35px; }
        .moving-icon:nth-child(8) { animation-duration: 21s; top: 85%; left: 25%; font-size: 28px; animation-direction: reverse; }
        .moving-icon:nth-child(9) { animation-duration: 16s; top: 20%; left: 40%; font-size: 32px; }
        .moving-icon:nth-child(10) { animation-duration: 23s; top: 45%; left: 75%; font-size: 38px; }
        .moving-icon:nth-child(11) { animation-duration: 14s; top: 75%; left: 55%; font-size: 42px; }
        .moving-icon:nth-child(12) { animation-duration: 24s; top: 5%; left: 55%; font-size: 36px; animation-direction: reverse; }

        /* Login Card */
        .login-container {
            width: 100%;
            max-width: 450px;
            margin: 20px;
            z-index: 10;
            position: relative;
        }

        .login-card {
            background: white;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            transition: transform 0.3s ease;
            backdrop-filter: blur(0px);
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        /* Header Section */
        .card-header {
            background: linear-gradient(135deg, #1a56db 0%, #0e3b9e 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .logo-icon i {
            font-size: 40px;
            color: white;
        }

        .card-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-header p {
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
        }

        /* Body Section */
        .card-body {
            padding: 40px 35px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 25px;
        }

        .input-group-custom {
            position: relative;
        }

        .input-group-custom i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            z-index: 1;
        }

        .form-control-custom {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: #1a56db;
            background: white;
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        .password-box {
            position: relative;
        }

        .password-box i.input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            z-index: 1;
        }

        .password-box input {
            padding-left: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.3s ease;
            z-index: 1;
        }

        .toggle-password:hover {
            color: #1a56db;
        }

        /* Select Dropdown */
        .form-select-custom {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 15px;
            background: #f8fafc;
            cursor: pointer;
            appearance: none;
            transition: all 0.3s ease;
        }

        .form-select-custom:focus {
            outline: none;
            border-color: #1a56db;
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a56db 0%, #0e3b9e 100%);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(26, 86, 219, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Register Link */
        .register-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .register-link a {
            color: #1a56db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #0e3b9e;
            text-decoration: underline;
        }

        /* Alert Styles */
        .alert-custom {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .alert-custom i {
            font-size: 18px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                margin: 16px auto;
                width: calc(100% - 32px);
            }

            .card-body {
                padding: 30px 25px;
            }
            
            .card-header {
                padding: 30px 25px;
            }
            
            .logo-icon {
                width: 60px;
                height: 60px;
            }
            
            .logo-icon i {
                font-size: 30px;
            }
            
            .card-header h2 {
                font-size: 24px;
            }
        }
    </style>
    <!-- CSRF Protection Shield -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script>
    window.CSRF_TOKEN = "{{ csrf_token() }}";
    (function() {
        if (window.fetch) {
            const _origFetch = window.fetch;
            window.fetch = function(url, options) {
                options = options || {};
                const method = (options.method || 'GET').toUpperCase();
                if (!['GET', 'HEAD', 'OPTIONS', 'TRACE'].includes(method)) {
                    options.headers = options.headers || {};
                    const token = window.CSRF_TOKEN || (document.querySelector('meta[name="csrf-token"]') && document.querySelector('meta[name="csrf-token"]').getAttribute('content'));
                    if (token) {
                        if (typeof Headers !== 'undefined' && options.headers instanceof Headers) {
                            if (!options.headers.has('X-CSRFToken')) options.headers.set('X-CSRFToken', token);
                        } else if (Array.isArray(options.headers)) {
                            options.headers.push(['X-CSRFToken', token]);
                        } else {
                            if (!options.headers['X-CSRFToken']) options.headers['X-CSRFToken'] = token;
                        }
                    }
                }
                return _origFetch(url, options);
            };
        }
        if (window.$ && $.ajaxSetup) {
            $.ajaxSetup({
                beforeSend: function(xhr, settings) {
                    if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type)) {
                        xhr.setRequestHeader("X-CSRFToken", window.CSRF_TOKEN);
                    }
                }
            });
        }
        if (navigator.sendBeacon) {
            const _origBeacon = navigator.sendBeacon.bind(navigator);
            navigator.sendBeacon = function(url, data) {
                if (data instanceof FormData) {
                    if (!data.has('csrf_token')) data.append('csrf_token', window.CSRF_TOKEN);
                } else if (typeof data === 'string') {
                    try {
                        const obj = JSON.parse(data);
                        if (typeof obj === 'object' && obj !== null && !obj.csrf_token) {
                            obj.csrf_token = window.CSRF_TOKEN;
                            data = JSON.stringify(obj);
                        }
                    } catch(e) {}
                }
                return _origBeacon(url, data);
            };
        }
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('form[method="POST"], form[method="post"]').forEach(function(form) {
                if (!form.querySelector('input[name="csrf_token"]')) {
                    var input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'csrf_token';
                    input.value = window.CSRF_TOKEN;
                    form.appendChild(input);
                }
            });
        });
    })();
    </script>
</head>
<body>
{% include 'components/startup_splash.html' %}

    <!-- Animated Educational Background Icons -->
    <div class="bg-decorations" aria-hidden="true">
        <div class="moving-icon"><i class="fas fa-book"></i></div>
        <div class="moving-icon"><i class="fas fa-pencil-alt"></i></div>
        <div class="moving-icon"><i class="fas fa-graduation-cap"></i></div>
        <div class="moving-icon"><i class="fas fa-chalkboard-teacher"></i></div>
        <div class="moving-icon"><i class="fas fa-calculator"></i></div>
        <div class="moving-icon"><i class="fas fa-flask"></i></div>
        <div class="moving-icon"><i class="fas fa-globe"></i></div>
        <div class="moving-icon"><i class="fas fa-ruler"></i></div>
        <div class="moving-icon"><i class="fas fa-atom"></i></div>
        <div class="moving-icon"><i class="fas fa-dna"></i></div>
        <div class="moving-icon"><i class="fas fa-music"></i></div>
        <div class="moving-icon"><i class="fas fa-palette"></i></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="card-header">
                <div class="logo-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h2>Welcome Back!</h2>
                <p>Login to continue your learning journey</p>
            </div>
            
            <div class="card-body">
                {% if error %}
                <div class="alert-custom">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <div class="input-group-custom">
                            <i class="fas fa-user"></i>
                            <input type="text" class="form-control-custom" name="username" placeholder="Username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="password-box">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" class="form-control-custom" name="password" id="password" placeholder="Password" required>
                            <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-group-custom">
                            <i class="fas fa-user-tag"></i>
                            <select class="form-select-custom" name="role" required>
                                <option value="student">Student</option>
                                <option value="Admin">Admin</option>
                                <option value="Teacher">Teacher</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt"></i>
                        Login
                    </button>
                </form>

                <div class="register-link">
                    <i class="fas fa-user-plus"></i>
                    <a href="/register">Don't have an account? Sign Up</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const password = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");

        toggle.addEventListener("click", function () {
            if (password.type === "password") {
                password.type = "text";
                toggle.classList.remove("fa-eye");
                toggle.classList.add("fa-eye-slash");
            } else {
                password.type = "password";
                toggle.classList.remove("fa-eye-slash");
                toggle.classList.add("fa-eye");
            }
        });
    </script>
</body>
</html>
