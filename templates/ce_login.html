<!DOCTYPE html>
<html>
<head>
    <title>Entrance Exam Login | COGNITARA EXAM SYSTEM</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            font-family: 'Inter', 'Segoe UI', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative Background Layer */
        .bg-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        /* Animated Background Elements */
        .bg-shape {
            position: absolute;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape-1 {
            top: -10%;
            right: -5%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        .bg-shape-2 {
            bottom: -10%;
            left: -5%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 25s infinite ease-in-out reverse;
        }

        .bg-shape-3 {
            top: 40%;
            right: 20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 18s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, -20px) rotate(180deg); }
        }

        /* Floating Icons */
        .floating-icon {
            position: absolute;
            color: rgba(139, 92, 246, 0.08);
            pointer-events: none;
            z-index: 0;
            animation: floatIcon 15s infinite linear;
        }

        @keyframes floatIcon {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* Main Login Card */
        .login-card {
            background: white;
            border-radius: 40px;
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3);
        }

        /* Header Section */
        .card-header {
            background: linear-gradient(135deg, #1a56db 0%, #8b5cf6 100%);
            padding: 45px 35px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 8s infinite;
        }

        @keyframes shimmer {
            0% { transform: translate(-30%, -30%) rotate(0deg); }
            100% { transform: translate(30%, 30%) rotate(360deg); }
        }

        .logo-icon {
            width: 85px;
            height: 85px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255,255,255,0); }
        }

        .logo-icon i {
            font-size: 42px;
            color: white;
        }

        .card-header h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .card-header p {
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
        }

        /* Body Section */
        .card-body {
            padding: 40px 35px;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 24px;
        }

        .input-group-custom {
            position: relative;
            transition: all 0.3s ease;
        }

        .input-group-custom i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .form-control-custom {
            width: 100%;
            padding: 15px 16px 15px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8fafc;
            font-weight: 500;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: #8b5cf6;
            background: white;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        .form-control-custom:focus + i {
            color: #8b5cf6;
        }

        /* Password Toggle */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper i.input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            z-index: 1;
        }

        .password-wrapper input {
            padding-left: 48px;
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.3s ease;
            z-index: 1;
            font-size: 18px;
        }

        .toggle-password:hover {
            color: #8b5cf6;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1a56db 0%, #8b5cf6 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(26, 86, 219, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Alert Styles */
        .alert-custom {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
            padding: 14px 18px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .alert-custom i {
            font-size: 18px;
        }

        /* Footer Links */
        .footer-links {
            margin-top: 25px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .footer-links a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-links a:hover {
            color: #1a56db;
        }

        .footer-links .divider {
            color: #e2e8f0;
            margin: 0 12px;
        }

        /* Features Section */
        .features {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .feature {
            flex: 1;
            text-align: center;
            padding: 12px 8px;
            background: #f8fafc;
            border-radius: 14px;
            transition: all 0.3s ease;
        }

        .feature:hover {
            background: #f1f5f9;
            transform: translateY(-2px);
        }

        .feature i {
            font-size: 20px;
            color: #8b5cf6;
            margin-bottom: 6px;
            display: block;
        }

        .feature span {
            font-size: 10px;
            color: #64748b;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card-body {
                padding: 30px 25px;
            }
            
            .card-header {
                padding: 35px 25px;
            }
            
            .logo-icon {
                width: 70px;
                height: 70px;
            }
            
            .logo-icon i {
                font-size: 34px;
            }
            
            .card-header h2 {
                font-size: 24px;
            }
            
            .features {
                flex-wrap: wrap;
            }
            
            .feature {
                flex: calc(50% - 8px);
            }
        }
    </style>
    <!-- CSRF Protection Shield -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script>
    window.CSRF_TOKEN = "{{ csrf_token() }}";
    (function() {
        if (window.fetch) {
            const _origFetch = window.fetch;
            window.fetch = function(url, options) {
                options = options || {};
                const method = (options.method || 'GET').toUpperCase();
                if (!['GET', 'HEAD', 'OPTIONS', 'TRACE'].includes(method)) {
                    options.headers = options.headers || {};
                    const token = window.CSRF_TOKEN || (document.querySelector('meta[name="csrf-token"]') && document.querySelector('meta[name="csrf-token"]').getAttribute('content'));
                    if (token) {
                        if (typeof Headers !== 'undefined' && options.headers instanceof Headers) {
                            if (!options.headers.has('X-CSRFToken')) options.headers.set('X-CSRFToken', token);
                        } else if (Array.isArray(options.headers)) {
                            options.headers.push(['X-CSRFToken', token]);
                        } else {
                            if (!options.headers['X-CSRFToken']) options.headers['X-CSRFToken'] = token;
                        }
                    }
                }
                return _origFetch(url, options);
            };
        }
        if (window.$ && $.ajaxSetup) {
            $.ajaxSetup({
                beforeSend: function(xhr, settings) {
                    if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type)) {
                        xhr.setRequestHeader("X-CSRFToken", window.CSRF_TOKEN);
                    }
                }
            });
        }
        if (navigator.sendBeacon) {
            const _origBeacon = navigator.sendBeacon.bind(navigator);
            navigator.sendBeacon = function(url, data) {
                if (data instanceof FormData) {
                    if (!data.has('csrf_token')) data.append('csrf_token', window.CSRF_TOKEN);
                } else if (typeof data === 'string') {
                    try {
                        const obj = JSON.parse(data);
                        if (typeof obj === 'object' && obj !== null && !obj.csrf_token) {
                            obj.csrf_token = window.CSRF_TOKEN;
                            data = JSON.stringify(obj);
                        }
                    } catch(e) {}
                }
                return _origBeacon(url, data);
            };
        }
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('form[method="POST"], form[method="post"]').forEach(function(form) {
                if (!form.querySelector('input[name="csrf_token"]')) {
                    var input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'csrf_token';
                    input.value = window.CSRF_TOKEN;
                    form.appendChild(input);
                }
            });
        });
    })();
    </script>
</head>
<body>
{% include 'components/startup_splash.html' %}

    <!-- Animated Background Layer -->
    <div class="bg-decorations" aria-hidden="true">
        <div class="bg-shape bg-shape-1"></div>
        <div class="bg-shape bg-shape-2"></div>
        <div class="bg-shape bg-shape-3"></div>

        <!-- Floating Icons -->
        <div class="floating-icon" style="top: 15%; left: 10%; animation-duration: 18s;"><i class="fas fa-graduation-cap"></i></div>
        <div class="floating-icon" style="top: 75%; left: 85%; animation-duration: 22s;"><i class="fas fa-book"></i></div>
        <div class="floating-icon" style="top: 40%; left: 90%; animation-duration: 20s;"><i class="fas fa-pencil-alt"></i></div>
        <div class="floating-icon" style="top: 85%; left: 15%; animation-duration: 25s;"><i class="fas fa-calculator"></i></div>
        <div class="floating-icon" style="top: 25%; left: 80%; animation-duration: 16s;"><i class="fas fa-flask"></i></div>
    </div>

    <div class="login-card">
        <div class="card-header">
            <div class="logo-icon">
                <i class="fas fa-door-open"></i>
            </div>
            <h2>Entrance Exam</h2>
            <p>Login to access your examination</p>
        </div>
        
        <div class="card-body">
            {% if error %}
            <div class="alert-custom">
                <i class="fas fa-exclamation-triangle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <div class="input-group-custom">
                        <i class="fas fa-user-graduate"></i>
                        <input type="text" name="username" class="form-control-custom" placeholder="Username" required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <div class="password-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" class="form-control-custom" id="password" placeholder="Password" required>
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    Login to Exam
                </button>
            </form>

            <!-- Features -->
            <div class="features">
                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <span>Secure Exam</span>
                </div>
                <div class="feature">
                    <i class="fas fa-clock"></i>
                    <span>Timed Test</span>
                </div>
                <div class="feature">
                    <i class="fas fa-chart-line"></i>
                    <span>Instant Results</span>
                </div>
                <div class="feature">
                    <i class="fas fa-mobile-alt"></i>
                    <span>Any Device</span>
                </div>
            </div>

            <!-- Footer Links -->
            <div class="footer-links">
                <a href="/">
                    <i class="fas fa-home"></i> Main Portal
                </a>
                <span class="divider">•</span>
                <a href="/register">
                    <i class="fas fa-user-plus"></i> Register
                </a>
                <span class="divider">•</span>
                <a href="#">
                    <i class="fas fa-question-circle"></i> Need Help?
                </a>
            </div>
        </div>
    </div>

    <script>
        // Password toggle functionality
        const password = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");

        if (toggle && password) {
            toggle.addEventListener("click", function () {
                if (password.type === "password") {
                    password.type = "text";
                    toggle.classList.remove("fa-eye");
                    toggle.classList.add("fa-eye-slash");
                } else {
                    password.type = "password";
                    toggle.classList.remove("fa-eye-slash");
                    toggle.classList.add("fa-eye");
                }
            });
        }

        // Add floating animation to icons
        const floatingIcons = document.querySelectorAll('.floating-icon');
        floatingIcons.forEach((icon, index) => {
            const duration = 15 + (index * 2);
            const delay = index * 1.5;
            icon.style.animationDuration = `${duration}s`;
            icon.style.animationDelay = `${delay}s`;
        });
    </script>
</body>
</html>
